<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>ARK — send to vault</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --line:#262c36; --fg:#e7ecf3; --dim:#8b97a7;
          --ok:#3fb950; --dup:#d29922; --err:#f85149; --accent:#4c8dff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding:22px 18px 10px; }
  h1 { font-size:20px; margin:0; letter-spacing:.3px; }
  h1 b { color:var(--accent); }
  .sub { color:var(--dim); font-size:13px; margin-top:2px; }
  main { padding:12px 18px 90px; max-width:640px; margin:0 auto; }
  .drop { border:1.5px dashed var(--line); border-radius:16px; background:var(--card);
          padding:34px 18px; text-align:center; color:var(--dim); }
  .drop strong { color:var(--fg); display:block; font-size:17px; margin-bottom:4px; }
  .pick { display:inline-block; margin-top:16px; background:var(--accent); color:#fff;
          font-weight:600; padding:13px 22px; border-radius:12px; cursor:pointer; }
  input[type=file]{ display:none; }
  .stat { display:flex; gap:16px; color:var(--dim); font-size:13px; margin:16px 2px 4px; }
  .stat b { color:var(--fg); }
  ul { list-style:none; padding:0; margin:14px 0 0; }
  li { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
       border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:14px; }
  li .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:20px; }
  .b-stored{ background:rgba(63,185,80,.15); color:var(--ok);}
  .b-duplicate{ background:rgba(210,153,34,.15); color:var(--dup);}
  .b-uploading{ background:rgba(76,141,255,.15); color:var(--accent);}
  .b-failed{ background:rgba(248,81,73,.15); color:var(--err);}
  .where { color:var(--dim); font-size:12px; }
  .banner { background:rgba(248,81,73,.12); color:var(--err); border:1px solid rgba(248,81,73,.3);
            padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; display:none; }
  .auth { display:flex; gap:8px; margin-bottom:14px; }
  .auth input { min-width:0; flex:1; background:var(--card); color:var(--fg); border:1px solid var(--line);
                border-radius:10px; padding:11px 12px; font:inherit; }
  .auth button { background:var(--accent); color:white; border:0; border-radius:10px;
                 padding:10px 14px; font-weight:600; }
  footer { position:fixed; bottom:0; left:0; right:0; text-align:center; padding:10px;
           color:var(--dim); font-size:12px; background:linear-gradient(transparent,var(--bg) 40%); }
</style>
</head>
<body>
<header>
  <h1>Send to <b>ARK</b></h1>
  <div class="sub" id="sub">your non-destructive vault</div>
</header>
<main>
  <div class="banner" id="banner"></div>
  <form class="auth" id="auth">
    <input id="token" type="password" autocomplete="off" placeholder="Bearer token from ark serve"
           aria-label="ARK bearer token" required>
    <button type="submit">Connect</button>
  </form>
  <div class="drop" id="drop">
    <strong>Back up your photos</strong>
    Pick photos or videos — each is copied into your vault, deduplicated and
    organized. Originals on your phone are never touched.
    <label class="pick">Choose photos
      <input type="file" id="file" multiple accept="image/*,video/*">
    </label>
  </div>
  <div class="stat"><span>sent this session: <b id="n">0</b></span>
    <span>vault: <b id="assets">–</b> items, <b id="objects">–</b> unique</span></div>
  <ul id="list"></ul>
</main>
<footer>ARK · nothing here deletes anything</footer>
<script>
const $ = s => document.querySelector(s);
// Kept only in this page's memory: never put bearer credentials in a URL or
// persistent localStorage where history, screenshots, or other scripts expose it.
let token = '';
let sent = 0;

function banner(msg){ const b=$('#banner'); b.textContent=msg; b.style.display='block'; }
function clearBanner(){ $('#banner').style.display='none'; }

async function refreshStatus(){
  if(!token) return;
  try{
    const r = await fetch('/status', {headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){ banner('Token rejected. Re-enter the bearer token that `ark serve` printed.'); return; }
    const s = await r.json();
    clearBanner();
    $('#assets').textContent = s.assets; $('#objects').textContent = s.objects;
  }catch(e){ /* offline — ignore */ }
}

function row(file){
  const li=document.createElement('li');
  li.innerHTML=`<span class="name"></span><span class="badge b-uploading">uploading…</span>`;
  li.querySelector('.name').textContent=file.name;
  $('#list').prepend(li);
  return li;
}
function done(li, res){
  const badge=li.querySelector('.badge');
  if(!res.ok){ badge.className='badge b-failed'; badge.textContent='failed';
    if(res.error){ const w=document.createElement('div'); } return; }
  const st=res.status;
  badge.className='badge b-'+(st==='duplicate'?'duplicate':'stored');
  badge.textContent = st==='duplicate' ? 'already had it' : 'backed up';
  if(res.organized_path){
    const w=document.createElement('div'); w.className='where';
    w.textContent=res.organized_path.replace(/^organized\//,'→ ');
    li.appendChild(w);
  }
  $('#n').textContent = ++sent;
}

async function upload(file){
  if(!token){ banner('Enter the bearer token before uploading.'); return; }
  const li=row(file);
  try{
    const r=await fetch('/ingest',{method:'POST',
      headers:{'Authorization':'Bearer '+token,'X-Filename':file.name},
      body:file});
    done(li, await r.json());
  }catch(e){ done(li,{ok:false,error:String(e)}); }
  refreshStatus();
}

$('#file').addEventListener('change', e=>{
  [...e.target.files].forEach(upload);
  e.target.value='';
});
// drag & drop (desktop)
const drop=$('#drop');
['dragover','drop'].forEach(ev=>drop.addEventListener(ev,e=>e.preventDefault()));
drop.addEventListener('drop', e=>[...e.dataTransfer.files].forEach(upload));

$('#auth').addEventListener('submit', e=>{
  e.preventDefault();
  token=$('#token').value.trim();
  if(token) refreshStatus();
});

if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
banner('Enter the bearer token that `ark serve` printed. Use only on a trusted LAN; HTTP is not encrypted.');
</script>
</body>
</html>
