[project]
name = "ark-vault"
version = "0.1.0"
description = "ARK — the intelligent, non-destructive vault for your entire digital life."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ark = "ark.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ark"]

[tool.setuptools.package-data]
ark = ["geodata/*.csv", "webapp/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
